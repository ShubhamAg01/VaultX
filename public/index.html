<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>VaultX — Sign In</title>
  <meta name="description" content="Zero-knowledge encrypted password manager." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <img src="/logo.svg" height="28" alt="VaultX" />
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Enter your master password to unlock your vault</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. alex" autocomplete="username" required autofocus />
        </div>

        <div class="form-group">
          <label for="password">Master Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Enter master password" autocomplete="current-password" required />
            <button type="button" class="eye-btn" id="eye-pw" title="Toggle password visibility"></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" id="login-btn" style="margin-top:8px;">
          <span id="btn-text">Unlock Vault</span>
          <span id="btn-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <div class="alt-link">
        Have an invite link? <a href="/register">Join Vault →</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/icons.js"></script>
  <script src="/js/crypto.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const eyeBtn = document.getElementById('eye-pw');
    if (eyeBtn) {
      eyeBtn.innerHTML = ICONS.eye;
      eyeBtn.addEventListener('click', function () {
        const inp = document.getElementById('password');
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        this.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
      });
    }
  </script>
</body>

</html>
