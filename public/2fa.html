<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultX — Two-Factor Authentication</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="/logo.svg" height="26" alt="VaultX" />
                </div>
                <h1 class="auth-title">Two-Factor Authentication</h1>
                <p class="auth-subtitle">Enter the 6-digit code from your authenticator app</p>
            </div>

            <div id="alert-container"></div>

            <form id="totp-form">
                <div class="form-group">
                    <label for="totp-code">Verification Code</label>
                    <input type="text" id="totp-code" name="totp-code" placeholder="000000" maxlength="6"
                        inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required autofocus
                        style="letter-spacing: 8px; font-size: 24px; text-align: center; font-family: var(--font-mono);" />
                </div>
                <button type="submit" id="verify-btn" class="btn btn-primary">
                    <span id="btn-text">Verify Code</span>
                    <span id="btn-spinner" class="spinner hidden"></span>
                </button>
            </form>

            <div class="auth-link">
                <a href="/">← Return to Login</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="/js/icons.js"></script>
    <script src="/js/crypto.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
