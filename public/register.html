<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>VaultX — Create Account</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <img src="/logo.svg" height="28" alt="VaultX" />
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Your master password encrypts your vault client-side</p>
      </div>

      <div id="alert-box"></div>

      <form id="register-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="3–30 characters, alphanumeric" autocomplete="username" required minlength="3" maxlength="30" autofocus />
        </div>

        <div class="form-group">
          <label for="password">Master Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12" oninput="onStrength(this.value)" />
            <button type="button" class="eye-btn" id="eye-pw" title="Toggle password visibility"></button>
          </div>
          <div class="strength-row">
            <div class="s-bar-wrap">
              <div class="s-bar" id="s-bar"></div>
            </div>
            <span class="s-label" id="s-label">—</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your master password" autocomplete="new-password" required />
            <button type="button" class="eye-btn" id="eye-confirm" title="Toggle password visibility"></button>
          </div>
        </div>

        <div class="form-group" id="invite-group">
          <label for="invite-code">Invite Token <span id="invite-badge" style="font-size:11px;color:var(--text-dim);">(Required)</span></label>
          <input type="text" id="invite-code" name="invite-code" placeholder="Paste invite token from administrator" autocomplete="off" style="font-family:var(--font-mono);font-size:12px;" />
        </div>

        <button type="submit" class="btn btn-primary w-full" id="register-btn" style="margin-top:8px;">
          <span id="btn-text">Create Vault</span>
          <span id="btn-spinner" class="spinner" style="display:none;"></span>
        </button>
      </form>

      <div class="alt-link">
        Already have an account? <a href="/">Sign in →</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/icons.js"></script>
  <script src="/js/crypto.js"></script>
  <script>
    const eyePw = document.getElementById('eye-pw');
    const eyeConfirm = document.getElementById('eye-confirm');
    if (eyePw) {
      eyePw.innerHTML = ICONS.eye;
      eyePw.addEventListener('click', function () {
        const inp = document.getElementById('password');
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        this.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
      });
    }
    if (eyeConfirm) {
      eyeConfirm.innerHTML = ICONS.eye;
      eyeConfirm.addEventListener('click', function () {
        const inp = document.getElementById('confirm-password');
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        this.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
      });
    }

    function onStrength(pw) {
      const bar = document.getElementById('s-bar');
      const label = document.getElementById('s-label');
      if (!pw) {
        bar.style.width = '0%';
        label.textContent = '—';
        label.style.color = 'var(--text-dim)';
        return;
      }
      const s = getPasswordStrength(pw);
      bar.style.width = s.width;
      bar.style.background = s.color;
      label.textContent = s.level;
      label.style.color = s.color;
    }
  </script>
  <script src="/js/auth.js"></script>
</body>

</html>
